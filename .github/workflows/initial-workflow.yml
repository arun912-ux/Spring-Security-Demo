name: GitHub Actions Demo
run-name: ${{ github.actor }} is testing out GitHub Actions 🚀
on:
  - push
  - merge
  - pull_request
  - workflow_dispatch

jobs:
  Explore-GitHub-Actions:
    runs-on: self-hosted
    steps:
      - run: echo "🎉 The job was automatically triggered by a ${{ github.event_name }} event."
      - run: echo "🐧 This job is now running on a ${{ runner.os }} server self-hosted!"
      - run: echo "🔎 The name of your branch is ${{ github.ref }} and your repository is ${{ github.repository }}."
      - name: Check out repository code
        uses: actions/checkout@v4
      - run: echo "💡 The ${{ github.repository }} repository has been cloned to the self-hosted-runner."
      - run: echo "🖥️ The workflow is now ready to test your code on the self-hosted-runner."
      - name: List files in the repository
        run: |
          ls ${{ github.workspace }}
      - run: echo "🍏 This job's status is ${{ job.status }}."


  list-files :
    needs: Explore-GitHub-Actions
    runs-on: self-hosted
    steps:
#      - uses: awalsh128/cache-apt-pkgs-action@latest
#        with:
#          packages: tree
#      - name: List files
#        run: |
#          tree -L 3

#
      - name: install package 'tree' on runner
        run: | 
          id -a
          sudo apt-get install tree -y
          which tree
      - name: List files
        run: |
          tree -L 3
